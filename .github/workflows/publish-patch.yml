name: Publish patch image

on:
  push:
    branches: [patch]


permissions:
  contents: read
  packages: write


env:
  UPSTREAM_REPO_URL: https://github.com/tt-rss/tt-rss.git


jobs:
  publish:
    name: Publish Docker image app
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # merge-base below needs the full history
        fetch-depth: 0

    # Use the timestamp of the upstream commit this branch is based on, so that
    # RPC::checkforupdates() still reports newer upstream changes.
    - name: Get upstream base commit timestamp
      run: |
        git fetch --no-tags "$UPSTREAM_REPO_URL" main
        BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
        COMMIT_TIMESTAMP="$(git show -s --format=%cI "$BASE_SHA")"
        echo "COMMIT_TIMESTAMP=$COMMIT_TIMESTAMP" >> "$GITHUB_ENV"

    - name: Get commit short SHA
      run: |
        COMMIT_SHORT_SHA="$(git rev-parse --short=8 HEAD)"
        echo "COMMIT_SHORT_SHA=$COMMIT_SHORT_SHA" >> "$GITHUB_ENV"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/tt-rss
        tags: |
          type=raw,value=latest
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push to image registry
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./.docker/app/Dockerfile
        platforms: linux/amd64
        pull: true
        build-args: |
          CI_COMMIT_BRANCH=${{ github.ref_name }}
          CI_COMMIT_SHA=${{ github.sha }}
          CI_COMMIT_SHORT_SHA=${{ env.COMMIT_SHORT_SHA }}
          CI_COMMIT_TIMESTAMP=${{ env.COMMIT_TIMESTAMP }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: true
        sbom: true
        push: true
